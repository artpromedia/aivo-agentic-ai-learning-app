# Supabase Configuration
# https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_manual_linking = false

[edge_runtime]
enabled = true
port = 54327

# Edge Functions Configuration
[[edge_runtime.functions]]
name = "baseline-transcribe-audio"
verify_jwt = true

[[edge_runtime.functions]]
name = "baseline-score-fluency"
verify_jwt = true

[[edge_runtime.functions]]
name = "baseline-process-audio"
verify_jwt = true

[[edge_runtime.functions]]
name = "baseline-cleanup-audio"
verify_jwt = true
# Schedule: Run daily at 2 AM
# Note: Scheduled execution must be configured in Supabase Dashboard
# Cron: 0 2 * * * (2 AM daily)
