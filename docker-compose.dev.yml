version: '3.8'

services:
  # API Gateway with hot reload
  api-gateway:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/api-gateway:/app
      - /app/__pycache__
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG

  # Frontend apps with Vite dev server
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    command: pnpm dev --host 0.0.0.0 --port 3000
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000

  parent-portal:
    build:
      context: ./apps/parent-portal
      dockerfile: Dockerfile.dev
    command: pnpm dev --host 0.0.0.0 --port 3001
    volumes:
      - ./apps/parent-portal:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=http://localhost:8000

  teacher-portal:
    build:
      context: ./apps/teacher-portal
      dockerfile: Dockerfile.dev
    command: pnpm dev --host 0.0.0.0 --port 3002
    volumes:
      - ./apps/teacher-portal:/app
      - /app/node_modules
    ports:
      - "3002:3002"
    environment:
      - VITE_API_URL=http://localhost:8000

  learner-app:
    build:
      context: ./apps/learner-app
      dockerfile: Dockerfile.dev
    command: pnpm dev --host 0.0.0.0 --port 3003
    volumes:
      - ./apps/learner-app:/app
      - /app/node_modules
    ports:
      - "3003:3003"
    environment:
      - VITE_API_URL=http://localhost:8000

  admin-portal:
    build:
      context: ./apps/admin-portal
      dockerfile: Dockerfile.dev
    command: pnpm dev --host 0.0.0.0 --port 5007
    volumes:
      - ./apps/admin-portal:/app
      - /app/node_modules
    ports:
      - "5007:5007"
    environment:
      - VITE_API_URL=http://localhost:8000
