name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env files
        run: |
          # Required secret: VITE_API_URL - API endpoint URL
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > .env
          echo "NODE_ENV=production" >> .env
          cp .env apps/learner-app/.env || true
          cp .env apps/parent-portal/.env || true
          cp .env apps/teacher-portal/.env || true
          cp .env apps/admin-portal/.env || true
          cp .env apps/district-portal/.env || true
          cp .env apps/web/.env || true

      - name: Build all apps
        run: pnpm build

      # Add deployment steps here based on your hosting provider
      # Examples: Vercel, Netlify, AWS, etc.
      
      - name: Deploy (placeholder)
        run: echo "Add deployment steps for your hosting provider"
