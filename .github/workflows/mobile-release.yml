name: Mobile App Release

on:
  push:
    tags:
      - 'v*.*.*-mobile'
      - 'v*.*.*-ios'
      - 'v*.*.*-android'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - both
          - ios
          - android
      track:
        description: 'Release track'
        required: true
        type: choice
        options:
          - beta
          - release

jobs:
  # ============================================
  # iOS Build and Deploy
  # ============================================
  ios-build:
    name: iOS Build & Deploy
    runs-on: macos-14 # Latest macOS with Xcode 15
    if: |
      (github.event_name == 'push' && (contains(github.ref, '-mobile') || contains(github.ref, '-ios'))) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/mobile-learner

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CocoaPods
        working-directory: apps/mobile-learner/ios
        run: |
          gem install cocoapods
          pod install

      - name: Configure App Store Connect API
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Setup signing certificates
        env:
          CERTIFICATES_P12: ${{ secrets.IOS_CERTIFICATES_P12 }}
          CERTIFICATES_PASSWORD: ${{ secrets.IOS_CERTIFICATES_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          # Create temporary keychain
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          
          # Import certificate
          echo "$CERTIFICATES_P12" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATES_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          
          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Run tests
        working-directory: apps/mobile-learner
        run: bundle exec fastlane ios test
        continue-on-error: true

      - name: Build and deploy to TestFlight (Beta)
        if: github.event.inputs.track == 'beta' || github.event_name == 'push'
        working-directory: apps/mobile-learner
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          ITC_PROVIDER: ${{ secrets.ITC_PROVIDER }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: bundle exec fastlane ios beta

      - name: Build and deploy to App Store (Release)
        if: github.event.inputs.track == 'release'
        working-directory: apps/mobile-learner
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          ITC_PROVIDER: ${{ secrets.ITC_PROVIDER }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: bundle exec fastlane ios release

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f certificate.p12

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-artifacts
          path: |
            apps/mobile-learner/build/*.ipa
            apps/mobile-learner/fastlane/test_output
          retention-days: 30

  # ============================================
  # Android Build and Deploy
  # ============================================
  android-build:
    name: Android Build & Deploy
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && (contains(github.ref, '-mobile') || contains(github.ref, '-android'))) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/mobile-learner

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > apps/mobile-learner/android/app/release.keystore

      - name: Create Google Play Service Account JSON
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          echo "$PLAY_STORE_JSON_KEY" > apps/mobile-learner/play-store-key.json

      - name: Run tests
        working-directory: apps/mobile-learner
        run: bundle exec fastlane android test
        continue-on-error: true

      - name: Build and deploy to Play Store Beta
        if: github.event.inputs.track == 'beta' || github.event_name == 'push'
        working-directory: apps/mobile-learner
        env:
          KEYSTORE_FILE: ./android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: bundle exec fastlane android beta

      - name: Build and deploy to Play Store Production
        if: github.event.inputs.track == 'release'
        working-directory: apps/mobile-learner
        env:
          KEYSTORE_FILE: ./android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: bundle exec fastlane android release

      - name: Cleanup
        if: always()
        run: |
          rm -f apps/mobile-learner/android/app/release.keystore
          rm -f apps/mobile-learner/play-store-key.json

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-artifacts
          path: |
            apps/mobile-learner/android/app/build/outputs/bundle/**/*.aab
            apps/mobile-learner/android/app/build/outputs/apk/**/*.apk
            apps/mobile-learner/fastlane/test_output
          retention-days: 30

  # ============================================
  # Create GitHub Release
  # ============================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ios-build, android-build]
    if: always() && (needs.ios-build.result == 'success' || needs.android-build.result == 'success')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download iOS artifacts
        if: needs.ios-build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ios-build-artifacts
          path: ./artifacts/ios

      - name: Download Android artifacts
        if: needs.android-build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-build-artifacts
          path: ./artifacts/android

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            VERSION=$(date +%Y.%m.%d-%H%M)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Mobile Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ github.event.inputs.track == 'beta' || contains(github.ref, 'beta') }}
          files: |
            ./artifacts/ios/*.ipa
            ./artifacts/android/bundle/**/*.aab
          body: |
            ## Mobile App Release v${{ steps.version.outputs.version }}
            
            ### What's Changed
            - Check the commit history for detailed changes
            
            ### Platform Status
            - iOS: ${{ needs.ios-build.result }}
            - Android: ${{ needs.android-build.result }}
            
            ### Download Links
            - **iOS**: Available on TestFlight / App Store
            - **Android**: Available on Play Store Beta / Production
            
            ### Installation
            - iOS users: Install via TestFlight or App Store
            - Android users: Install via Play Store
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Post-deployment notifications
  # ============================================
  notify:
    name: Send Deployment Notifications
    runs-on: ubuntu-latest
    needs: [ios-build, android-build]
    if: always()
    
    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATUS="✅ Success"
          COLOR="good"
          
          if [ "${{ needs.ios-build.result }}" == "failure" ] || [ "${{ needs.android-build.result }}" == "failure" ]; then
            STATUS="❌ Failed"
            COLOR="danger"
          fi
          
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"Mobile Release Deployment Complete\",
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"fields\": [
                  {\"title\": \"Status\", \"value\": \"$STATUS\", \"short\": true},
                  {\"title\": \"iOS Build\", \"value\": \"${{ needs.ios-build.result }}\", \"short\": true},
                  {\"title\": \"Android Build\", \"value\": \"${{ needs.android-build.result }}\", \"short\": true},
                  {\"title\": \"Trigger\", \"value\": \"${{ github.event_name }}\", \"short\": true}
                ]
              }]
            }"
