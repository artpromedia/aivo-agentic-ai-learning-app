version: '3.9'

services:
  # ========================================
  # PostgreSQL Database
  # ========================================
  postgres:
    image: postgres:16-alpine
    container_name: aivo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-aivo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aivo_dev_password}
      POSTGRES_DB: ${DB_NAME:-aivo_db}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - aivo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aivo_user} -d ${DB_NAME:-aivo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Redis Cache
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: aivo-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-aivo_redis_dev} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - aivo-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========================================
  # API Gateway (FastAPI)
  # ========================================
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: aivo-api-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-aivo_user}:${DB_PASSWORD:-aivo_dev_password}@postgres:5432/${DB_NAME:-aivo_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-aivo_redis_dev}@redis:6379/0
      - AUTH_SERVICE_URL=http://auth-service:8001
      - AI_SERVICE_URL=http://ai-inference-service:8002
    volumes:
      - ./services/api-gateway:/app
      - api_uploads:/app/uploads
    ports:
      - "8000:8000"
    networks:
      - aivo-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ========================================
  # Auth Service (FastAPI)
  # ========================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: aivo-auth-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-aivo_user}:${DB_PASSWORD:-aivo_dev_password}@postgres:5432/${DB_NAME:-aivo_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-aivo_redis_dev}@redis:6379/1
    volumes:
      - ./services/auth-service:/app
    ports:
      - "8001:8001"
    networks:
      - aivo-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  # ========================================
  # AI Inference Service (FastAPI)
  # ========================================
  ai-inference-service:
    build:
      context: ./services/ai-inference-service
      dockerfile: Dockerfile
    container_name: aivo-ai-inference
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-aivo_redis_dev}@redis:6379/2
    volumes:
      - ./services/ai-inference-service:/app
      - ai_models:/app/models
    ports:
      - "8002:8002"
    networks:
      - aivo-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # ========================================
  # CURRICULUM DATABASE
  # ========================================
  curriculum-db:
    image: postgis/postgis:15-3.3-alpine
    container_name: aivo-curriculum-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aivo_curriculum
      POSTGRES_USER: ${DB_USER:-aivo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aivo_dev_password}
    volumes:
      - curriculum_data:/var/lib/postgresql/data
      - ./services/curriculum-service/models:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    networks:
      - aivo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aivo_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # CURRICULUM SERVICE
  # ========================================
  curriculum-service:
    build:
      context: ./services/curriculum-service
      dockerfile: Dockerfile
    container_name: aivo-curriculum-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-aivo_user}:${DB_PASSWORD:-aivo_dev_password}@curriculum-db:5432/aivo_curriculum
      - REDIS_URL=redis://:${REDIS_PASSWORD:-aivo_redis_dev}@redis:6379/3
    volumes:
      - ./services/curriculum-service:/app
      - curriculum_imports:/app/data/imports
    ports:
      - "8003:8003"
    networks:
      - aivo-network
    depends_on:
      curriculum-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload

  # ========================================
  # TRAINING SERVICE (for base brain training)
  # ========================================
  training-service:
    build:
      context: ./services/training-service
      dockerfile: Dockerfile
    container_name: aivo-training-service
    restart: "no"  # Run manually for training
    env_file:
      - .env
    environment:
      - CURRICULUM_DATABASE_URL=postgresql://${DB_USER:-aivo_user}:${DB_PASSWORD:-aivo_dev_password}@curriculum-db:5432/aivo_curriculum
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - MODEL_OUTPUT_PATH=/models
    volumes:
      - ./services/training-service:/app
      - training_models:/models
      - curriculum_imports:/app/data/curriculum
    ports:
      - "8004:8004"
    networks:
      - aivo-network
    depends_on:
      curriculum-db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8004 --reload
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 8G

  # ========================================
  # ASSESSMENT SCHEDULER (cron job service)
  # ========================================
  assessment-scheduler:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: aivo-assessment-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-aivo_user}:${DB_PASSWORD:-aivo_dev_password}@postgres:5432/${DB_NAME:-aivo_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-aivo_redis_dev}@redis:6379/0
      - AI_SERVICE_URL=http://ai-inference-service:8002
    volumes:
      - ./services/api-gateway:/app
      - ./scripts/cron:/cron
    networks:
      - aivo-network
    depends_on:
      postgres:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    # Run daily at 9 AM UTC
    command: >
      sh -c "
        echo '0 9 * * * cd /app && python /cron/assessment_scheduler.py >> /var/log/cron.log 2>&1' > /etc/crontabs/root &&
        crond -f -l 2
      "

networks:
  aivo-network:
    driver: bridge
    name: aivo-network

volumes:
  postgres_data:
    name: aivo-postgres-data
  redis_data:
    name: aivo-redis-data
  api_uploads:
    name: aivo-api-uploads
  ai_models:
    name: aivo-ai-models
  curriculum_data:
    name: aivo-curriculum-data
  curriculum_imports:
    name: aivo-curriculum-imports
  training_models:
    name: aivo-training-models
