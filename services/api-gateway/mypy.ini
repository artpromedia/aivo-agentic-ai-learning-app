[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True

# Exclude alembic directory from type checking
# Alembic's env.py dynamically modifies sys.path which mypy cannot track
[mypy-alembic.*]
ignore_errors = True

[mypy-alembic.env]
ignore_errors = True
