[tool.ruff]
# Exclude alembic and other generated directories
exclude = [
    "alembic",
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "*.egg-info",
]

line-length = 100

[tool.ruff.lint]
# Enable specific linting rules
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
]

# Ignore specific rules
ignore = [
    "F401",  # Unused imports - handled separately
    "E501",  # Line too long - handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# Ignore unused imports in __init__.py files
"__init__.py" = ["F401"]
# Ignore specific rules in test files
"tests/**/*.py" = ["F401", "F811"]
# Ignore import errors in conftest
"conftest.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "app.models.*",
    "app.core.*",
    "app.schemas.*",
    "PyPDF2",
    "pytesseract",
    "google.cloud.*",
    "boto3",
    "botocore.*",
    "aiofiles",
    "requests",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]
